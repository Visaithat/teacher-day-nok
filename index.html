<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070b" />
    <meta
      name="description"
      content="A scroll-driven film for Teacher Nok, from the Class of 2026."
    />
    <title>Happy Teacher's Day</title>
    <!--
      The finale callouts are written in Lao, so they need two faces: Patrick
      Hand for the Latin that appears inside a couple of the lines, and Noto
      Sans Lao Looped for the Lao itself. The browser picks per character -
      Patrick Hand has no Lao glyphs, so Lao falls through to the Looped face
      automatically.

      "Looped" is the Lao style with the rounded head-loops - the friendly,
      handwritten-looking one, and the closest thing to Patrick Hand that
      Google Fonts carries for Lao. `Phetsarath` is the alternative and reads
      more formal. Verified coverage: U+0E81-U+0EDF plus Latin.

      Deliberately a SEPARATE request from the main one: a typo in a family
      name makes Google Fonts reject the whole stylesheet, and that must not be
      able to take Playfair and Poppins - the entire rest of the film - down
      with it.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao+Looped:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!--
      The five handwritten letters on the backs of the panel photos. Each
      student writes in a different face, because five letters in one hand
      would read as one person pretending to be five.

      Patrick Hand is the fifth and is already requested above, so only four
      families are asked for here. Same reasoning as the Lao request: kept
      separate so a bad family name can only cost the letters their handwriting
      (they fall back to a generic cursive and stay perfectly readable), never
      the typography of the rest of the film.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Gloria+Hallelujah&family=Indie+Flower&family=Shadows+Into+Light&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
