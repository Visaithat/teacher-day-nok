<!doctype html>
<html><head><meta charset="utf-8"><title>viewer</title>
<style>html,body{margin:0;background:#222}#out{display:block}</style>
</head><body>
<canvas id="out" width="1200" height="900"></canvas>
<script>window.addEventListener('error',e=>{window.__err=String(e.message);document.title='ERROR'});window.addEventListener('unhandledrejection',e=>{window.__err=String(e.reason);document.title='ERROR'});</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/examples/jsm/libs/meshopt_decoder.module.js';

const W = 600, H = 450;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2b3038');
scene.add(new THREE.HemisphereLight(0xffffff, 0x555555, 2.2));
const d = new THREE.DirectionalLight(0xffffff, 2.2); d.position.set(2,4,5); scene.add(d);
const d2 = new THREE.DirectionalLight(0xffffff, 1.2); d2.position.set(-3,2,-4); scene.add(d2);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
const src = new URLSearchParams(location.search).get('m') || 'kengkue_artwork.glb';
const gltf = await loader.loadAsync('/uploads/' + src);
const root = gltf.scene;
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3());
root.position.sub(box.getCenter(new THREE.Vector3()));
scene.add(root);

const cam = new THREE.PerspectiveCamera(35, W/H, 0.01, 100);
const r = Math.max(size.x, size.y, size.z) * 2.6;
const views = [
  ['+Z front', new THREE.Vector3(0,0,1)],
  ['-Z back', new THREE.Vector3(0,0,-1)],
  ['3/4', new THREE.Vector3(0.8,0.4,1)],
  ['+X side', new THREE.Vector3(1,0.1,0.12)],
];
const out = document.getElementById('out');
const ctx = out.getContext('2d');
views.forEach(([name, dir], i) => {
  cam.position.copy(dir.clone().normalize().multiplyScalar(r));
  cam.lookAt(0,0,0);
  renderer.render(scene, cam);
  const x = (i%2)*W, y = Math.floor(i/2)*H;
  ctx.drawImage(renderer.domElement, x, y);
  ctx.fillStyle='#fff'; ctx.font='20px monospace'; ctx.fillText(name, x+12, y+28);
});
ctx.fillStyle='#ff0'; ctx.font='18px monospace';
ctx.fillText('size ' + size.toArray().map(v=>v.toFixed(3)).join(' x '), 12, 880);
window.__log=['ok']; document.title = 'READY';
</script>
</body></html>
